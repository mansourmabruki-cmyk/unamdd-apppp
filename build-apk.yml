name: Build Android APK (UNAMDD Mining)

# Compile automatiquement l'APK à chaque push, et au clic manuel (Run workflow).
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # L'action installe elle-même les composants et accepte les licences.
      - name: Installer le SDK Android
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Installer Cordova
        run: npm install -g cordova@12

      - name: Ajouter la plateforme Android
        run: cordova platform add android@13 --no-telemetry

      - name: Compiler l'APK de débogage
        run: cordova build android --no-telemetry

      - name: Localiser et renommer l'APK
        id: apk
        run: |
          APK=$(find platforms/android -name '*-debug.apk' | head -n1)
          echo "APK trouvé : $APK"
          cp "$APK" UNAMDD-Mining-debug.apk
          echo "path=UNAMDD-Mining-debug.apk" >> "$GITHUB_OUTPUT"

      - name: Publier l'APK (téléchargeable dans Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: UNAMDD-Mining-APK
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      # Crée aussi une Release GitHub avec l'APK quand on pousse un tag v* (ex : v1.0.0)
      - name: Publier une Release (sur tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
